apiVersion: v1
kind: Pod
metadata:
  name: bypass-test
  namespace: default
  labels:
    app: bypass-test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
